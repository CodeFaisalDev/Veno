<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #ffffff; /* Pure white background */
            color: #1a1c1c; /* Charcoal text (on-surface) */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden; /* Splash screen, no scrolling needed */
        }

        .fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.6s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .hero-pattern {
            background-image: radial-gradient(#e5e2e1 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: center;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="relative flex items-center justify-center h-screen w-full bg-surface-container-lowest">
<!-- Subtle background pattern for depth without clutter -->
<div class="absolute inset-0 hero-pattern opacity-30 z-0"></div>
<!-- Main Content Container -->
<main class="relative z-10 flex flex-col items-center justify-center text-center px-margin-mobile md:px-margin-desktop w-full max-w-4xl mx-auto">
<!-- Logo Area -->
<div class="fade-in-up flex flex-col items-center mb-md">
<!-- Minimalist Blood Drop Icon -->
<div class="w-16 h-16 md:w-20 md:h-20 mb-sm flex items-center justify-center bg-primary rounded-full shadow-sm text-on-primary">
<span class="material-symbols-outlined" style="font-size: 32px; font-variation-settings: 'FILL' 1;">bloodtype</span>
</div>
<!-- Brand Name -->
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight">
                Veno
            </h1>
</div>
<!-- Tagline -->
<div class="fade-in-up delay-1 mb-xl">
<p class="font-body-lg text-body-lg text-secondary">
                Vitality without Anxiety
            </p>
</div>
<!-- Loading Indicator / Next Action (Optional for splash) -->
<div class="fade-in-up delay-2 flex flex-col items-center">
<!-- A subtle pulsing line or spinner could go here. Keeping it ultra-minimalist with a small dot indicator -->
<div class="flex space-x-2">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant animate-pulse" style="animation-delay: 0.2s"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant animate-pulse" style="animation-delay: 0.4s"></div>
</div>
</div>
</main>
