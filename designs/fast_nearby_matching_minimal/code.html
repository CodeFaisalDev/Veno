<style>
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pulse-ring {
            animation: pulseRing 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.8); opacity: 0.5; }
            70% { transform: scale(2); opacity: 0; }
            100% { transform: scale(2); opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-surface-variant">
<!-- Header (Minimal for Intro/Linear Flow) -->
<header class="w-full pt-margin-mobile px-margin-mobile md:px-margin-desktop flex justify-end shrink-0 z-20 absolute top-0 left-0 fade-in-up">
<button class="font-label-sm text-label-sm text-secondary hover:text-on-surface transition-colors uppercase tracking-[0.1em] py-2">
            Skip
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col relative">
<!-- Graphic Area: High-Contrast Map & Radar -->
<div class="flex-grow relative flex items-center justify-center overflow-hidden min-h-[442px] md:min-h-[530px] fade-in-up delay-100">
<!-- Abstract Map Background -->
<div class="absolute inset-0 z-0 flex items-center justify-center opacity-40">

<!-- Subtle gradient fade to bottom text area -->
<div class="absolute inset-0 bg-gradient-to-b from-transparent via-surface-container-lowest/50 to-surface-container-lowest z-10"></div>
</div>
<!-- UI Overlay: Fast Matching Visualization -->
<div class="relative z-20 w-full max-w-[340px] aspect-square flex items-center justify-center">
<!-- Central User Node -->
<div class="relative z-30 w-14 h-14 rounded-full bg-on-surface flex items-center justify-center shadow-[0_0_0_8px_rgba(255,255,255,0.8)]">
<span class="material-symbols-outlined text-surface-container-lowest text-[24px]" style="font-variation-settings: 'FILL' 1;">person</span>
<!-- Radar Pulses -->
<div class="absolute inset-0 rounded-full border border-on-surface pulse-ring"></div>
<div class="absolute inset-0 rounded-full border border-on-surface pulse-ring" style="animation-delay: 1.5s;"></div>
</div>
<!-- Minimalist Donor Nodes & Connection Lines -->
<svg class="absolute inset-0 w-full h-full z-10 pointer-events-none">
<!-- Line to Top Right -->
<line class="opacity-30" stroke="#1a1c1c" stroke-dasharray="4 4" stroke-width="1.5" x1="50%" x2="80%" y1="50%" y2="25%"></line>
<!-- Line to Bottom Left -->
<line stroke="#1a1c1c" stroke-width="2" x1="50%" x2="20%" y1="50%" y2="70%"></line>
<!-- Line to Top Left (Faint) -->
<line class="opacity-10" stroke="#1a1c1c" stroke-width="1" x1="50%" x2="25%" y1="50%" y2="30%"></line>
</svg>
<!-- Donor 1 (Active Match) -->
<div class="absolute bottom-[20%] left-[10%] w-12 h-12 rounded-full bg-surface-container-lowest border-2 border-on-surface flex items-center justify-center z-20 shadow-[0_8px_24px_rgba(0,0,0,0.08)] transform -translate-x-1/2 translate-y-1/2">
<span class="material-symbols-outlined text-on-surface text-[24px]" style="font-variation-settings: 'FILL' 1;">bloodtype</span>

<div class="absolute -top-3 -right-6 bg-on-surface text-surface-container-lowest font-label-sm text-[10px] px-2 py-0.5 rounded-full whitespace-nowrap tracking-wider">
                        0.2 MI
                    </div>
</div>
<!-- Donor 2 (Scanning) -->
<div class="absolute top-[15%] right-[10%] w-8 h-8 rounded-full bg-surface-container-lowest border border-outline flex items-center justify-center z-20 transform translate-x-1/2 -translate-y-1/2">
<span class="material-symbols-outlined text-outline text-[16px]" style="font-variation-settings: 'FILL' 1;">bloodtype</span>
</div>
<!-- Donor 3 (Distant) -->
<div class="absolute top-[25%] left-[15%] w-6 h-6 rounded-full bg-surface-container-lowest border border-surface-variant flex items-center justify-center z-20 opacity-50">
<span class="material-symbols-outlined text-surface-variant text-[14px]">bloodtype</span>
</div>
</div>
</div>
<!-- Typography & Action Area -->
<div class="w-full px-margin-mobile md:px-margin-desktop pb-12 pt-8 shrink-0 flex flex-col gap-10 md:gap-12 relative z-30 fade-in-up delay-200">
<div class="flex flex-col gap-4 text-center md:text-left md:max-w-2xl md:mx-auto w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-xl md:text-headline-xl tracking-tight text-on-surface leading-tight">
                    Matches in<br class="md:hidden"/> Milliseconds.
                </h1>
<p class="font-body-md text-body-md md:font-body-lg md:text-body-lg text-secondary max-w-md mx-auto md:mx-0">
                    Our high-speed network continuously scans your immediate vicinity, locking onto compatible donors the moment you need them.
                </p>
</div>
<!-- Navigation Controls -->
<div class="flex flex-col md:flex-row items-center justify-between gap-8 md:max-w-2xl md:mx-auto w-full fade-in-up delay-300">
<!-- Progress Indicators -->
<div class="flex gap-2 items-center">
<div class="w-2 h-2 rounded-full bg-surface-variant transition-colors"></div>
<div class="w-8 h-2 rounded-full bg-on-surface transition-all duration-300"></div> <!-- Active -->
<div class="w-2 h-2 rounded-full bg-surface-variant transition-colors"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant transition-colors"></div>
</div>
<!-- Primary Action -->
<!-- Strictly adhering to pure white/charcoal theme for this specific design instead of default red -->
<button class="w-full md:w-auto bg-on-surface text-surface-container-lowest py-4 px-10 rounded-lg font-label-sm text-label-sm tracking-[0.05em] uppercase hover:bg-secondary hover:text-on-secondary transition-colors duration-200 flex items-center justify-center gap-2">
                    Continue
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
